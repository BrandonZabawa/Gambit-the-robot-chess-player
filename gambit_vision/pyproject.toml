# Dependency list for the gambit_vision notebooks (no installable package: all code lives in
# notebooks/, reused with %run). Install with:
#   pip install ".[dev]"            # notebooks + self-checks (tools/run_notebooks.sh)
#   pip install ".[train,dev]"      # plus torch for training (or use Colab, run_train_cnn.ipynb)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gambit_vision"
version = "0.2.0"
description = "Camera-based board state recognition for the Gambit chess robot (CAP5415), as notebooks."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-contrib-python",   # contrib build: cv2.aruco
    "chess",                   # python-chess (PyPI name is now "chess")
    "pyyaml",
    "pandas",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
train = ["torch", "torchvision", "tensorboard"]
dev = ["jupyter", "ipykernel", "nbclient", "nbformat"]
yolo = ["ultralytics"]         # optional alternative detector (notebooks/yolo.ipynb)

[tool.setuptools]
packages = []                  # dependencies only, nothing to install

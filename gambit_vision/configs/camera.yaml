# Camera, markers, warp and crop settings for M1 (calibration, homography) and M2 (capture).
# Paths are relative to gambit_vision/. Board geometry (square size, border, marker size and
# ids) comes from gambit_bringup/config/board.yaml; the copy below must match it.
intrinsics_file: calibration/camera_intrinsics.yaml   # written by run_calibrate.ipynb
board_yaml: ../gambit_bringup/config/board.yaml

camera:
  device: 0              # cv2.VideoCapture index (TODO M1: set for the real camera)
  width: 640
  height: 480

# ChArUco calibration target (M1). Printed by markers.ipynb. A different dictionary than the
# board markers so the calibration board can never be mistaken for a corner marker.
charuco:
  dictionary: DICT_5X5_100
  squares_x: 7
  squares_y: 5
  square_length: 0.030   # meters, measure after printing and update
  marker_length: 0.022
  min_corners: 12        # views with fewer detected ChArUco corners are dropped

markers:
  dictionary: DICT_4X4_50
  ids: {a1: 0, h1: 1, h8: 2, a8: 3}     # must match gambit_bringup/config/board.yaml

warp:
  square_px: 100                         # top-down image is 8 * square_px + 2 * margin_px wide
  margin_px: 100
  # Which side of the board is at the bottom of the warped image. The camera stands on the
  # black side (board.yaml camera.position), so "black_bottom" keeps the warped image in the
  # camera's orientation: pieces lean toward the top of the image, which is what the crop
  # extend_up below assumes. Use "white_bottom" only with a camera on the white side.
  view: black_bottom

crop:
  widen: 0.5         # fraction of a square added on the left and on the right
  extend_up: 1.0     # fraction of a square added above (toward the top of the warped image)
  size_wh: [100, 200]
